<nav class="container nav" aria-label="Principal">
  <a class="brand" href="#inicio" (click)="closeMenu()">
    <span class="brand-mark">&lt;/&gt;</span>
    {{ name }}
  </a>

  <ul class="links" [class.open]="menuOpen()" id="menu-principal">
    @for (link of links; track link.id) {
      <li>
        <a [href]="'#' + link.id" [class.active]="active() === link.id" (click)="closeMenu()">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>

  <div class="actions">
    <button
      class="icon-btn"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
    </button>
    <button
      class="icon-btn menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-principal"
      aria-label="Abrir menú"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</nav>
